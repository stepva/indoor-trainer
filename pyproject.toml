[project]
name = "indoor-trainer"
version = "0.1.0"
description = "Local macOS app to drive a Van Rysel D500 in ERG mode and export FIT files"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "qasync>=0.27",
    "fit-tool>=0.9.13",
]

[project.scripts]
trainer = "trainer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainer"]
